version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume-analyzer-backend
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./local.db}
      - DEBUG=${DEBUG:-true}
    command: "uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - resume-analyzer-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resume-analyzer-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:8000}
    command: "npm start"
    networks:
      - resume-analyzer-net
    depends_on:
      - backend

networks:
  resume-analyzer-net:
    driver: bridge
