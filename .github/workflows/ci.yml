name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run syntax check
      run: |
        python -m py_compile src/main.py

    - name: Lint with flake8
      run: |
        flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics || true

    - name: Security check with safety
      run: |
        pip install safety
        safety check --json || true

    - name: Run tests (when available)
      run: |
        pytest tests/ -v --tb=short --cov=src --cov-report=xml 2>/dev/null || echo "No tests yet"

    - name: Check for secrets
      run: |
        if git log --all -p | grep -i "secret\|password\|api.key\|api_key" | grep -v ".env.example"; then
          echo "⚠️ Warning: Possible secrets detected in git history"
        else
          echo "✅ No secrets detected"
        fi

  build-docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Build Docker image
      run: |
        docker build -t resume-analyzer:test .
      continue-on-error: true
